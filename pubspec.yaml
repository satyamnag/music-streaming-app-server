dependency_overrides:
  # Pin flutter_rust_bridge to match metadata_god 1.1.0's generated code
  # (codegen 2.11.1). Without this, pub resolves FRB to 2.12.0 and
  # MetadataGod.initialize() throws "codegen version (2.11.1) should be the
  # same as runtime version (2.12.0)" at startup, breaking the plugin layer.
  flutter_rust_bridge: 2.11.1
  bonsoir_android:
    git:
      url: https://github.com/KRTirtho/Bonsoir.git
      path: packages/bonsoir_android
  meta: 1.16.0
  web: ^1.1.0
  flutter_svg: ^2.0.17
  intl: any
  collection: any
  flutter_secure_storage_platform_interface: 2.0.0
