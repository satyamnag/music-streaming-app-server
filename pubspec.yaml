name: sangeet
description: Open source extensible music streaming platform and app, based on BYOMM (Bring your own music metadata) concept

publish_to: "none"

# versionName+buildNumber. The About screen renders these as
# "<buildNumber> (<version>)" — see lib/pages/settings/about.dart — so the
# `+82` half is what puts "82 (1.0.0)" on that screen, and it is also the
# Android versionCode Google Play uses to order uploads. It must increase by at
# least one on every Play upload; 82 follows 1.0.0+81.
#
# WHY NOT 79. This was requested as "79 (1.0.0)", which is not buildable as an
# upload: versionCode 79 was already used (commit 997d91e0) and 80 and 81
# followed it, so the code is spent twice over. Google Play rejects any upload
# whose versionCode does not strictly exceed the highest already published, and
# Android itself refuses to install a lower versionCode over a higher one
# (INSTALL_FAILED_VERSION_DOWNGRADE), so a 79 build could neither be uploaded nor
# installed on a device that has run 81. 82 is the next valid value.
#
# 82 carries four UI fixes:
#   * the mini player no longer overlaps the last row of any screen — the footer
#     reserve came from a hard-coded 100px that discarded the scaffold's measured
#     footer height (~136px), so every page was ~36px short;
#   * the home carousel clips with the slides' own corner radius, so banner
#     corners stay curved while sliding instead of snapping square;
#   * braced lyric labels (`{Pallavi}`, `{{Music}}`) render whole on ONE line,
#     scaled to fit rather than truncated or wrapped;
#   * a guard that every album and track surface keeps rendering the shared card.
#
# 84 carries the fixes for the reported list:
#   * the home wordmark gains a three-stop gold ramp and a fading underline
#     flourish, so it reads as designed rather than as plain text;
#   * the paywall can actually appear - the release .env previously carried no
#     SUPERWALL_API_KEY, and `registerPlacement` responded to an unconfigured SDK
#     by RUNNING the gated feature, so paid tracks played free in every build.
#     The key is now supplied and the gate fails CLOSED without it;
#   * the karaoke switch is visible again: both playback builders dropped
#     `karaokeStoragePath`, so the player's availability check saw null;
#   * the lyrics sub-tabs read Telugu, English Transliteration, English
#     Translation - the order was reversed in three separate lists;
#   * a share action on the main player that sends an actionable link, not just
#     the track's name;
#   * the floating mini player no longer hides the last row on the settings,
#     home, album, track, deity, search, playlist and analytics screens - two
#     shared list components reserved only 10dp of a ~136dp footer;
#   * all five analytics screens render in grid view, matching the home screen.
#
# 86 rebuilds after a credential audit. The build uses the live Supabase project
# (https://ngemrcsdfxufxnazeqke.supabase.co); earlier builds pointed at a retired
# project whose DNS no longer resolves, which surfaced as a Dio 500 on the home
# screen (the in-app server proxies /supabase/tracks and could not reach the
# database). Every credential was re-verified against its authoritative source.
