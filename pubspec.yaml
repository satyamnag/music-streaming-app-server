    - packages/flutter_undraw/assets/undraw/fixing_bugs.svg
    - packages/flutter_undraw/assets/undraw/secure_login.svg
    - packages/flutter_undraw/assets/undraw/explore.svg
    - packages/flutter_undraw/assets/undraw/dreamer.svg
    - packages/flutter_undraw/assets/undraw/happy_music.svg
    - packages/flutter_undraw/assets/undraw/follow_me_drone.svg
    - packages/flutter_undraw/assets/undraw/taken.svg
    - packages/flutter_undraw/assets/undraw/empty.svg
    - packages/flutter_undraw/assets/undraw/no_data.svg
    - packages/flutter_undraw/assets/undraw/process.svg
    - packages/flutter_undraw/assets/undraw/stars.svg
    # hetu script bytecode
    - packages/hetu_std/assets/bytecode/std.out
    - packages/hetu_otp_util/assets/bytecode/otp_util.out
    - packages/hetu_spotube_plugin/assets/bytecode/spotube_plugin.out
    # NewPipe binaries (desktop only)
    # - packages/flutter_new_pipe_extractor/assets/
  fonts:
    - family: RadixIcons
      fonts:
        - asset: packages/shadcn_flutter/icons/RadixIcons.otf
    - family: BootstrapIcons
      fonts:
        - asset: packages/shadcn_flutter/icons/BootstrapIcons.otf
    - family: Cookie
      fonts:
        - asset: assets/fonts/Cookie-Regular.ttf
          style: normal
          weight: 500
    # Dancing Script was REMOVED here.
    #
    # It never rendered on a real device: on two phones, two Android versions and
    # in both debug and release, the brand name silently fell back to the
    # platform sans-serif while every unit test passed. The tests passed because
    # `flutter_test` renders a real face only when the bytes are pushed in
    # through `FontLoader`, so it never exercised the engine's own bundled-font
    # lookup - which is the path that was failing.
    #
    # The brand is now a typographic lockup instead (`BrandWordmark`), built from
    # weight contrast, tracking and a gold gradient on the default face. Every
    # one of those properties is a plain `TextStyle` field, so the wordmark
    # renders identically everywhere by construction, with no font to load and
    # nothing that can silently fall back.
    #
    # The OFL licence below was removed with the font: the licence obligation is
    # to ship it WITH the font, so it has no purpose once the font is gone.


flutter_gen:
  output: lib/collections

