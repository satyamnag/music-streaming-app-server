name: Cover Variants (512x512 WebP)

# Generates the 512x512 WebP cover variants the Android app uses for grid cards,
# list rows and the media notification, and stores them in Supabase Storage next
# to the untouched 1024 originals.
#
#   writes : thumbnails/variants/512/<name>   (nothing else, ever)
#   reads  : the catalog rows + the original cover bytes
#
# Two triggers:
#   * schedule - runs automatically every 6 hours so that a cover added or
#     replaced in the admin portal produces (or refreshes) its 512 variant
#     without any manual dispatch. The script is idempotent: each run upservers
#     the rendition it derives from the CURRENT 1024 original, so both a new
#     cover and an updated one are handled.
#   * workflow_dispatch - manual on-demand run (immediate, no waiting).
#
# Scheduled workflows run only from the default branch and can be delayed at
# times of high load (https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule).
# This workflow never touches builds, tests or releases.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cover-variants
  cancel-in-progress: false

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (only the script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: tool
          sparse-checkout-cone-mode: false

      - name: Trigger context
        run: echo "event=${{ github.event_name }} ref=${{ github.ref_name }} sha=${{ github.sha }}"

      - name: Materialise .env (only key names are printed)
        env:
          DOTENV: ${{ secrets.DOTENV_RELEASE }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::error::DOTENV_RELEASE secret is empty; catalog credentials are unavailable."
            exit 1
          fi
          printf '%s\n' "$DOTENV" > .env
          sed -n 's/^\([A-Za-z0-9_]*\)=.*/\1/p' .env | sort -u

      - name: Install Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check "pillow==10.4.0"

      - name: Generate and verify variants
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ngemrcsdfxufxnazeqke.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tool/generate_cover_variants.py

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: cover-variants-manifest
          if-no-files-found: error
          retention-days: 30
          path: |
            out/cover-variants.csv
            out/cover-variants.json
