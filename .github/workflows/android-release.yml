name: Android Release Build

# Manual, on-demand Android build for the Soulful Bhakti app.
# Produces a signed release APK (and optionally an AAB for Play).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE        base64-encoded release keystore (.jks)
#   KEY_PROPERTIES  contents of android/key.properties (storeFile=upload-keystore.jks)
#   DOTENV_RELEASE  full .env contents used at compile time
#
# This workflow is independent of spotube-release-binary.yml, which is left
# untouched so nothing existing breaks.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel baked into the app
        type: choice
        options:
          - stable
          - nightly
        default: stable
      format:
        description: Build output format
        type: choice
        options:
          - apk
          - appbundle
          - both
        default: appbundle
      version_code:
        description: >-
          Android versionCode. LEAVE BLANK to use pubspec.yaml's `version:`
          (recommended). Supplying a value here OVERRIDES pubspec via
          --build-number, which is how an AAB ends up disagreeing with the
          "buildNumber (version)" line the About screen reads at runtime. Only
          set this to recover a specific upload.
        type: string
        default: ""
      version_name:
        description: >-
          Android versionName. LEAVE BLANK to use pubspec.yaml's `version:`
          (recommended). Supplying a value OVERRIDES pubspec via --build-name.
        type: string
        default: ""
      split_per_abi:
        description: >-
          Split APK per CPU architecture (smaller downloads). DOES NOT WORK YET:
          android/app/build.gradle pins ndk.abiFilters, and Gradle rejects that
          alongside splits - "Conflicting configuration : 'armeabi-v7a,arm64-v8a,
          x86_64' in ndk abiFilters cannot be present when splits abi filters are
          set". It fails in 13 seconds at configuration time, before any compile.
          Fixing it means making abiFilters conditional in build.gradle, which
          would touch the Play release's ABI set, so it is left alone; the
          universal APK already ships arm64-v8a + armeabi-v7a.
        type: boolean
        default: false
      flavor:
        description: >-
          Product flavor. Keep `stable` for the Play build (com.soulfulbhakti.app).
          IMPORTANT: `dev` and `nightly` DO NOT BUILD YET - they fail at
          :app:processDevReleaseGoogleServices with "No matching client found for
          package name 'com.soulfulbhakti.app.dev'", because android/app/
          google-services.json contains a Firebase client for com.soulfulbhakti.app
          only. To make them usable, register an Android app for each additional
          package name in the Firebase console and replace google-services.json;
          after that they install side-by-side with the Play build (they carry an
          applicationIdSuffix), which is the only way to test on a phone that
          already has the Play build: Play re-signs with its own key, so an
          upload-key APK can never update the Play one in place.
        type: choice
        options:
          - stable
          - dev
          - nightly
        default: stable

env:
  FLUTTER_VERSION: 3.35.2

permissions:
  contents: read

jobs:
  build_android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Record which commit was ACTUALLY checked out, into the run summary.
      #
      # Without this the artifact has no provenance at all, and the run's own
      # head_sha is misleading: it records the dispatch, while actions/checkout
      # (no `ref:` here) resolves the BRANCH TIP at the moment the job reaches
      # this step. Dispatch a build and push a commit while it waits for a runner,
      # and the two disagree — which is exactly how a build once produced an AAB
      # that did not contain the commit the run claimed to be building. Nobody can
      # tell which code is in an artifact from the artifact alone, so log it here
      # and make the question answerable.
      - name: Record the built commit
        run: |
          SHA="$(git rev-parse HEAD)"
          SUBJECT="$(git log -1 --pretty=%s)"
          echo "Building commit: ${SHA}"
          echo "Subject: ${SUBJECT}"
          {
            echo "### Built commit"
            echo ""
            echo '```'
            echo "${SHA}"
            echo "${SUBJECT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          java -version

      - name: Write .env (compile-time config)
        env:
          DOTENV: ${{ secrets.DOTENV_RELEASE }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::error::Secret DOTENV_RELEASE is not set. Add it in Settings -> Secrets -> Actions."
            exit 1
          fi
          printf '%s\n' "$DOTENV" > .env
          # Show only the KEYS, never the values, so the log stays safe.
          echo "Wrote .env with these keys:"
          grep -oE '^[A-Z_]+' .env | sort -u

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Secrets KEYSTORE and/or KEY_PROPERTIES are not set."
            exit 1
          fi
          # The workflow writes the keystore here; key.properties must reference
          # this exact relative path (storeFile=upload-keystore.jks).
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          test -s android/app/upload-keystore.jks || { echo "::error::keystore decode produced an empty file"; exit 1; }
          echo "Signing files written."

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (routes, drift, envied)
        run: dart run build_runner build --delete-conflicting-outputs

      # Resolve the version ONCE, from pubspec, and export it for both build
      # steps and for the verification step at the end.
      #
      # WHY: the About screen renders `"<buildNumber> (<version>)"` from
      # PackageInfo, which is the Android versionCode/versionName baked in at
      # build time. If the workflow passes --build-number/--build-name, those
      # OVERRIDE pubspec and the artifact can ship a version that does not match
      # the source it was built from. Reading pubspec here and passing nothing
      # unless the operator explicitly asked for an override makes the artifact
      # and the About screen the same number by construction.
      - name: Resolve version
        id: version
        run: |
          SPEC="$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//')"
          if [ -z "$SPEC" ]; then
            echo "::error::pubspec.yaml has no top-level 'version:' line"
            exit 1
          fi
          NAME="${SPEC%%+*}"
          CODE="${SPEC##*+}"
          if [ "$CODE" = "$SPEC" ]; then
            echo "::error::pubspec version '$SPEC' has no +buildNumber part"
            exit 1
          fi

          # An explicit input wins, so a specific upload can still be reproduced.
          if [ -n "${{ inputs.version_code }}" ]; then CODE="${{ inputs.version_code }}"; fi
          if [ -n "${{ inputs.version_name }}" ]; then NAME="${{ inputs.version_name }}"; fi

          case "$CODE" in
            ''|*[!0-9]*) echo "::error::versionCode '$CODE' must be a positive integer"; exit 1 ;;
          esac

          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "About screen will show: ${CODE} (${NAME})"
          {
            echo "### Version"
            echo ""
            echo '```'
            echo "versionName : ${NAME}"
            echo "versionCode : ${CODE}"
            echo "About screen: ${CODE} (${NAME})"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        if: ${{ inputs.format == 'apk' || inputs.format == 'both' }}
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          ARGS="--build-number ${{ steps.version.outputs.version_code }} --build-name ${{ steps.version.outputs.version_name }}"
          if [ "${{ inputs.split_per_abi }}" = "true" ]; then
            flutter build apk --release --flavor ${{ inputs.flavor }} $ARGS --split-per-abi
          else
            flutter build apk --release --flavor ${{ inputs.flavor }} $ARGS
          fi

      - name: Build App Bundle (Play upload)
        if: ${{ inputs.format == 'appbundle' || inputs.format == 'both' }}
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          flutter build appbundle --release --flavor ${{ inputs.flavor }} \
            --build-number ${{ steps.version.outputs.version_code }} \
            --build-name ${{ steps.version.outputs.version_name }}

      - name: List build outputs
        run: |
          echo "--- flutter-apk ---"
          find build/app/outputs/flutter-apk -type f -name '*.apk' -exec ls -lh {} \; 2>/dev/null || true
          echo "--- bundle ---"
          find build/app/outputs/bundle -type f -name '*.aab' -exec ls -lh {} \; 2>/dev/null || true

      # Verify the ARTIFACT, not the build log.
      #
      # The point of these steps is that "the build succeeded" says nothing about
      # what is inside the bundle. A Play AAB must carry the intended
      # versionCode/versionName and must be signed with the upload key. Both are
      # read back out of the produced file here, so a mismatch fails the run
      # rather than being discovered in the Play Console.
      - name: Verify AAB
        if: ${{ inputs.format == 'appbundle' || inputs.format == 'both' }}
        run: |
          AAB="$(find build/app/outputs/bundle -maxdepth 2 -type f -name '*.aab' | head -n1)"
          test -n "$AAB" || { echo "::error::No AAB produced"; exit 1; }
          echo "AAB      : $AAB"
          ls -lh "$AAB"
          echo "SHA-256  : $(sha256sum "$AAB" | awk '{print $1}')"

          # `bundletool` is the canonical tool for inspecting a bundle; the
          # Android SDK ships it. Fall back to unzipping the manifest if the SDK
          # path is unavailable, so the check never silently no-ops.
          BT="$(find "$ANDROID_HOME" -name 'bundletool*.jar' 2>/dev/null | head -n1)"
          if [ -n "$BT" ]; then
            echo "Using bundletool: $BT"
            java -jar "$BT" dump manifest --bundle "$AAB" > manifest.xml
            grep -E 'versionCode|versionName|package=' manifest.xml | head -n5
            ACTUAL_CODE="$(grep -oE 'versionCode="[0-9]+"' manifest.xml | head -n1 | grep -oE '[0-9]+')"
          else
            echo "::warning::bundletool not found; reading the version from the AAB's base manifest instead."
            unzip -o -q "$AAB" -d aab_extract
            ACTUAL_CODE="$(grep -aoE 'versionCode[^0-9]{0,8}[0-9]+' aab_extract/base/manifest/AndroidManifest.xml | head -n1 | grep -oE '[0-9]+$')"
          fi

          EXPECTED="${{ steps.version.outputs.version_code }}"
          echo "Expected versionCode: $EXPECTED"
          echo "Actual   versionCode: ${ACTUAL_CODE:-<unreadable>}"
          if [ "$ACTUAL_CODE" != "$EXPECTED" ]; then
            echo "::error::the AAB carries versionCode '${ACTUAL_CODE}' but '$EXPECTED' was requested"
            exit 1
          fi

      - name: Verify AAB signature
        if: ${{ inputs.format == 'appbundle' || inputs.format == 'both' }}
        run: |
          AAB="$(find build/app/outputs/bundle -maxdepth 2 -type f -name '*.aab' | head -n1)"
          # A Play upload must be signed with the UPLOAD key (Play re-signs with
          # the app signing key). An unsigned bundle is rejected by the Console.
          #
          # `jarsigner -verify` is the right tool for a bundle: it is a JAR, and
          # apksigner does not read .aab.
          jarsigner -verify -verbose -certs "$AAB" > js.txt 2>&1 || true
          if ! grep -qE 'jar verified|verified' js.txt; then
            echo "::error::the AAB is not signed"
            tail -n 40 js.txt
            exit 1
          fi
          echo "AAB is signed."
          grep -E 'CN=|SHA-256 digest' js.txt | head -n5
          {
            echo "### AAB signature"
            echo ""
            echo '```'
            grep -E 'jar verified|CN=' js.txt | head -n5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: ${{ inputs.format == 'apk' || inputs.format == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: soulful-bhakti-apk
          # Flavor-agnostic: the APK is app-<flavor>-release.apk, and
          # --split-per-abi appends -<abi>. Naming it after a fixed flavor here
          # is what would silently upload nothing for a dev build.
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB artifact
        if: ${{ inputs.format == 'appbundle' || inputs.format == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: soulful-bhakti-aab
          # build/app/outputs/bundle/<flavor>Release/app-<flavor>-release.aab
          path: build/app/outputs/bundle/*/*.aab

      # Signing material and the compile-time .env are written into the workspace
      # above. Remove them whatever happened, so an artifact or a subsequent step
      # can never pick them up.
      - name: Clean up secrets (always)
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks .env manifest.xml js.txt
          rm -rf aab_extract
          echo "Signing files and .env removed from the workspace."
