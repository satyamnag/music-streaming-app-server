name: Android Release Build

# Manual, on-demand Android build for the Soulful Bhakti app.
# Produces a signed release APK (and optionally an AAB for Play).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE        base64-encoded release keystore (.jks)
#   KEY_PROPERTIES  contents of android/key.properties (storeFile=upload-keystore.jks)
#   DOTENV_RELEASE  full .env contents used at compile time
#
# This workflow is independent of spotube-release-binary.yml, which is left
# untouched so nothing existing breaks.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel baked into the app
        type: choice
        options:
          - stable
          - nightly
        default: stable
      format:
        description: Build output format
        type: choice
        options:
          - apk
          - appbundle
          - both
        default: appbundle
      version_code:
        description: >-
          Android versionCode. LEAVE BLANK to use pubspec.yaml's `version:`
          (recommended). Supplying a value here OVERRIDES pubspec via
          --build-number, which is how an AAB ends up disagreeing with the
          "buildNumber (version)" line the About screen reads at runtime. Only
          set this to recover a specific upload.
        type: string
        default: ""
      version_name:
        description: >-
          Android versionName. LEAVE BLANK to use pubspec.yaml's `version:`
          (recommended). Supplying a value OVERRIDES pubspec via --build-name.
        type: string
        default: ""
      split_per_abi:
        description: >-
          Split APK per CPU architecture (smaller downloads). DOES NOT WORK YET:
          android/app/build.gradle pins ndk.abiFilters, and Gradle rejects that
          alongside splits - "Conflicting configuration : 'armeabi-v7a,arm64-v8a,
          x86_64' in ndk abiFilters cannot be present when splits abi filters are
          set". It fails in 13 seconds at configuration time, before any compile.
          Fixing it means making abiFilters conditional in build.gradle, which
          would touch the Play release's ABI set, so it is left alone; the
          universal APK already ships arm64-v8a + armeabi-v7a.
        type: boolean
        default: false
      dart_defines:
        description: >-
          VERIFICATION ONLY. Extra --dart-define flags, comma separated, e.g.
          "IMAGE_CACHE_DIAGNOSTICS=true". Leave blank for a real release: the
          artifact is then byte-identical to one built before this input existed.
          An artifact built with defines set must not be uploaded to Play.
        type: string
        default: ""
      flavor:
        description: >-
          Product flavor. Keep `stable` for the Play build (com.soulfulbhakti.app).
          IMPORTANT: `dev` and `nightly` DO NOT BUILD YET - they fail at
          :app:processDevReleaseGoogleServices with "No matching client found for
          package name 'com.soulfulbhakti.app.dev'", because android/app/
          google-services.json contains a Firebase client for com.soulfulbhakti.app
          only. To make them usable, register an Android app for each additional
          package name in the Firebase console and replace google-services.json;
          after that they install side-by-side with the Play build (they carry an
          applicationIdSuffix), which is the only way to test on a phone that
          already has the Play build: Play re-signs with its own key, so an
          upload-key APK can never update the Play one in place.
        type: choice
        options:
          - stable
          - dev
          - nightly
        default: stable

env:
  FLUTTER_VERSION: 3.35.2

permissions:
  contents: read

jobs:
  build_android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Record which commit was ACTUALLY checked out, into the run summary.
      #
      # Without this the artifact has no provenance at all, and the run's own
      # head_sha is misleading: it records the dispatch, while actions/checkout
      # (no `ref:` here) resolves the BRANCH TIP at the moment the job reaches
      # this step. Dispatch a build and push a commit while it waits for a runner,
      # and the two disagree — which is exactly how a build once produced an AAB
      # that did not contain the commit the run claimed to be building. Nobody can
      # tell which code is in an artifact from the artifact alone, so log it here
      # and make the question answerable.
      - name: Record the built commit
        run: |
          SHA="$(git rev-parse HEAD)"
          SUBJECT="$(git log -1 --pretty=%s)"
          echo "Building commit: ${SHA}"
          echo "Subject: ${SUBJECT}"
          {
            echo "### Built commit"
            echo ""
            echo '```'
            echo "${SHA}"
            echo "${SUBJECT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        # The ubuntu-22.04 image arrives with ~30 GB of preinstalled toolchains
        # this build never touches, and the Flutter SDK (~4 GB), the Android SDK,
        # Gradle's caches and Cargokit compiling Rust for THREE ABIs push what is
        # left to zero. Observed on this repository as
        #     ##[error]No space left on device
        # mid-compile, reproducibly, in two consecutive runs - while the same
        # commit builds fine on the public repository, whose runners have warm
        # caches. So the space has to be reclaimed rather than hoped for.
        #
        # Only toolchains this build does not use are removed. Two things are
        # deliberately KEPT:
        #  * the Android NDK - android/app/build.gradle pins
        #    ndkVersion = "29.0.14206865" and the native plugin builds need it;
        #  * /opt/microsoft - it hosts PowerShell, and the "Verify drift schema
        #    snapshots" step runs `pwsh -NoProfile -File tool/...ps1`. An earlier
        #    revision of this step deleted it, and that step then died with
        #    `pwsh: command not found` (exit 127) - a self-inflicted failure that
        #    the sanity line below now catches immediately instead of two steps
        #    later.
        run: |
          echo "--- disk before ---"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "--- disk after ---"
          df -h /
          # A later step needs pwsh; fail here with a clear message if the
          # cleanup above ever takes it out again.
          echo "pwsh : $(command -v pwsh || echo MISSING)"
          command -v pwsh >/dev/null || { echo "::error::pwsh is missing after disk cleanup, but the drift-schema step needs it"; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          java -version

      - name: Write .env from AWS Secrets Manager (primary source)
        # The canonical vault: the 9 compile-time keys live in AWS Secrets
        # Manager (ap-south-1) under <service>/<key> (supabase/url, ... /
        # onesignal/api-key). Read them here first. This step NEVER fails the
        # job; whatever it cannot supply is left to the DOTENV_RELEASE step.
        #
        # It must NOT abort on the first failure. It used to: the loop ran
        # `: > .env; exit 0` the moment a single secret failed, and because
        # supabase/url is FIRST in the list and is the one secret that could not
        # be fetched, this step never supplied a single value. Every release run
        # from 2026-10-11 to 2026-10-21 fell straight through to the fallback,
        # silently. So collect the failures, keep whatever did work, report both.
        #
        # The failure text IS printed. On failure the CLI holds no secret value
        # to leak - stderr is an AWS error naming the secret and the API call -
        # and discarding it is precisely why this stayed invisible for ten days.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          set -eu
          : > .env
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY not set; falling back to DOTENV_RELEASE."
            exit 0
          fi
          SECRETS="supabase/url supabase/anon-key clerk/publishable-key r2/base-url release/channel update-check/enabled hide-donations superwall/api-key onesignal/api-key posthog/api-key posthog/host"
          FAILED=""
          for s in $SECRETS; do
            if ! V="$(aws secretsmanager get-secret-value --secret-id "$s" --query SecretString --output text 2>&1)"; then
              echo "::warning::AWS fetch failed for $s: $(printf '%s' "$V" | tr '\n' ' ')"
              FAILED="$FAILED $s"
              continue
            fi
            case "$s" in
              supabase/url)          K=SUPABASE_URL ;;
              supabase/anon-key)     K=SUPABASE_ANON_KEY ;;
              clerk/publishable-key) K=CLERK_PUBLISHABLE_KEY ;;
              r2/base-url)           K=R2_BASE_URL ;;
              release/channel)       K=RELEASE_CHANNEL ;;
              update-check/enabled)  K=ENABLE_UPDATE_CHECK ;;
              hide-donations)        K=HIDE_DONATIONS ;;
              superwall/api-key)     K=SUPERWALL_API_KEY ;;
              onesignal/api-key)     K=ONESIGNAL_APP_ID ;;
              posthog/api-key)       K=POSTHOG_API_KEY ;;
              posthog/host)          K=POSTHOG_HOST ;;
              *) continue ;;
            esac
            printf '%s=%s\n' "$K" "$V" >> .env
          done
          # The old listing was `grep -oE '^[A-Z_]+'`, which truncates a key at
          # its first digit and so printed R2_BASE_URL as "R" - a lossy list is
          # how a missing key went unremarked. Match digits too.
          echo "AWS Secrets Manager supplied these keys:"
          sed -n 's/^\([A-Za-z0-9_]*\)=.*/\1/p' .env | sort -u || true
          if [ -n "$FAILED" ]; then
            echo "::warning::AWS Secrets Manager did not supply:$FAILED"
          fi
          exit 0

      - name: Fill remaining .env gaps from DOTENV_RELEASE (fallback)
        # Runs after the AWS step in every case, and MERGES - it must never
        # overwrite. It used to probe only `^SUPABASE_URL=` and then `> .env` the
        # entire file, which was wrong twice over: that single probe is the one
        # key DOTENV_RELEASE does not carry, and a wholesale overwrite throws
        # away every key AWS did supply. Add only the keys still missing.
        if: ${{ !cancelled() }}
        env:
          DOTENV: ${{ secrets.DOTENV_RELEASE }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::warning::DOTENV_RELEASE is not set; nothing to merge in."
            exit 0
          fi
          printf '%s\n' "$DOTENV" > .env.fallback
          ADDED=""
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|'#'*) continue ;; esac
            case "$line" in *=*) ;; *) continue ;; esac
            key="${line%%=*}"
            case "$key" in ''|*[!A-Za-z0-9_]*) continue ;; esac
            if grep -q "^${key}=" .env; then
              continue
            fi
            printf '%s\n' "$line" >> .env
            ADDED="$ADDED $key"
          done < .env.fallback
          rm -f .env.fallback
          if [ -n "$ADDED" ]; then
            echo "::warning::Filled from DOTENV_RELEASE:$ADDED"
          else
            echo ".env needed nothing from DOTENV_RELEASE."
          fi
          # Show only the KEYS, never the values, so the log stays safe.
          echo "Final .env keys:"
          sed -n 's/^\([A-Za-z0-9_]*\)=.*/\1/p' .env | sort -u || true

      - name: Verify required .env keys
        # Two distinct failure modes are covered here.
        #
        # ONESIGNAL_APP_ID carries an explicit `defaultValue: ""` in
        # lib/collections/env.dart, and main.dart initialises OneSignal only
        # when it is non-empty - so a build without it ships with push silently
        # disabled: no runtime error, no notification, nothing to debug from.
        #
        # SUPABASE_URL, SUPABASE_ANON_KEY and CLERK_PUBLISHABLE_KEY have no
        # default at all, and Env.supabaseUrl is passed straight into
        # SupabaseClient() in lib/provider/server/routes/supabase_data.dart.
        #
        # Do NOT assume a missing one breaks code generation and is therefore
        # caught anyway. On the 2026-10-11 and 2026-10-21 runs .env had no
        # SUPABASE_URL whatsoever, envied still reported "1 output", and both
        # jobs went GREEN. A green build proves nothing about these keys. Only
        # this check does. Fail loudly, here.
        run: |
          missing=""
          for key in SUPABASE_URL SUPABASE_ANON_KEY CLERK_PUBLISHABLE_KEY ONESIGNAL_APP_ID; do
            grep -q "^${key}=." .env || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::.env is missing required release keys:$missing"
            exit 1
          fi
          echo "All required release keys are present (values not shown)."

      - name: Check PostHog configuration (warning only, never fatal)
        # POSTHOG_API_KEY carries `defaultValue: ""` in lib/collections/env.dart
        # and the SDK is set up only when it is non-empty, so a release without
        # it ships with analytics silently disabled - no error, no events,
        # nothing to notice. That is the same failure shape as the missing
        # ONESIGNAL_APP_ID / SUPERWALL_API_KEY cases above, so it is reported.
        #
        # It is deliberately NOT in the required-keys list yet: the token has to
        # exist in AWS Secrets Manager (posthog/api-key) first, and a hard failure
        # here would block every release until it does. Promote it to the
        # required list above once the secret is provisioned.
        #
        # This check never fails the job: analytics being off is a product
        # decision, not a broken build.
        run: |
          if grep -q "^POSTHOG_API_KEY=." .env; then
            echo "PostHog token present; analytics is available to users who opt in."
          else
            echo "::warning::POSTHOG_API_KEY is not set. This release ships with product analytics disabled (the opt-in toggle will be present but inert). Add the AWS Secrets Manager secret posthog/api-key, and posthog/host if the project is in the EU region."
          fi

          if grep -q "^POSTHOG_HOST=." .env; then
            echo "PostHog host is set."
          else
            echo "POSTHOG_HOST not set; defaulting to https://us.i.posthog.com."
          fi

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Secrets KEYSTORE and/or KEY_PROPERTIES are not set."
            exit 1
          fi

          # Normalise the base64 before decoding.
          #
          # `base64 --decode` is strict: it rejects any character outside the
          # alphabet, including a CR, a stray space, or a line that a shell or a
          # secret store re-wrapped. That strictness failed this workflow twice
          # with the opaque message "base64: invalid input", which says nothing
          # about WHICH byte was wrong.
          #
          # Stripping all whitespace first makes the decode independent of how
          # the value was transported, and the diagnostics below report the shape
          # of what actually arrived when it still fails, so the next failure is
          # diagnosable instead of a guess.
          CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          echo "keystore b64 length: ${#CLEAN}"

          if ! printf '%s' "$CLEAN" | base64 --decode > android/app/upload-keystore.jks 2>/dev/null; then
            echo "::error::Could not base64-decode the KEYSTORE secret."
            echo "Length after whitespace strip: ${#CLEAN}"
            echo "Non-base64 characters present: $(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)"
            echo "First 8 characters: $(printf '%s' "$CLEAN" | cut -c1-8)"
            exit 1
          fi

          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties

          # A keystore is never empty and always starts with the JKS or PKCS12
          # magic, so check both rather than only the size: an empty decode and a
          # wrong-file decode are different failures.
          test -s android/app/upload-keystore.jks || { echo "::error::keystore decode produced an empty file"; exit 1; }
          echo "keystore bytes: $(wc -c < android/app/upload-keystore.jks)"
          echo "key.properties keys: $(grep -oE '^[A-Za-z]+' android/key.properties | tr '\n' ' ')"

          # Prove the keystore is readable and that the alias/passwords in
          # key.properties actually open it, here rather than 15 minutes into a
          # Gradle build. `keytool -list` is non-destructive.
          ALIAS="$(grep -E '^keyAlias=' android/key.properties | cut -d= -f2-)"
          STOREPASS="$(grep -E '^storePassword=' android/key.properties | cut -d= -f2-)"
          if ! keytool -list -keystore android/app/upload-keystore.jks \
                 -storepass "$STOREPASS" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened with the alias and store password in KEY_PROPERTIES."
            exit 1
          fi
          echo "Signing files written and verified (alias: ${ALIAS})."

      - name: Verify the keystore is the Play upload key
        # Pin the signing key, the same way the .env guard pins the keys the app
        # needs. KEYSTORE is a repo secret and cannot be read back, so a wrong or
        # subtly-corrupted value has no other symptom: the build goes green, and
        # either Play rejects the bundle or - worse - you ship something signed
        # with a key nothing else in the world uses.
        #
        # EXPECTED_KEYSTORE_SHA256 is the byte-exact SHA-256 of
        #   C:\Users\SATYAM NAG\Documents\keystores\soulfulbhakti-upload.jks
        # the upload key the LIVE Play listing is signed with. That file is the
        # only source of truth for signing; this step makes the build refuse to
        # proceed with anything else.
        #
        # If this fails, the KEYSTORE secret is not that file. Do NOT "fix" it by
        # editing the hash. A genuinely rotated upload key must be re-registered
        # in Play Console first, and only then may this constant change.
        env:
          EXPECTED_KEYSTORE_SHA256: "435dafda878703c73137b17102000e271d1bcf76da53dc2e414f814b471d117b"
        run: |
          ACTUAL_SHA="$(sha256sum android/app/upload-keystore.jks | awk '{print $1}')"
          echo "keystore SHA-256 : ${ACTUAL_SHA}"
          echo "expected SHA-256 : ${EXPECTED_KEYSTORE_SHA256}"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_KEYSTORE_SHA256}" ]; then
            echo "::error::The KEYSTORE secret is not soulfulbhakti-upload.jks - refusing to sign with the wrong key."
            echo "::error::expected ${EXPECTED_KEYSTORE_SHA256}, got ${ACTUAL_SHA}"
            exit 1
          fi
          echo "Keystore matches the Play upload key."

          # Also record WHICH certificate signs the artifact, every run. Expected
          # SHA256 fingerprint, matching upload_certificate.pem in the same
          # folder:
          #   96:2A:0B:93:2F:48:98:24:C3:58:88:61:F1:01:E3:4E:
          #   67:E9:26:49:5F:8F:95:F8:18:B5:F9:0C:4C:14:29:21
          ALIAS="$(grep -E '^keyAlias=' android/key.properties | cut -d= -f2-)"
          STOREPASS="$(grep -E '^storePassword=' android/key.properties | cut -d= -f2-)"
          keytool -list -v -keystore android/app/upload-keystore.jks \
            -storepass "$STOREPASS" -alias "$ALIAS" 2>/dev/null |
            grep -E 'Alias name|Owner:|Valid from|SHA256:' || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (routes, drift, envied)
        run: dart run build_runner build --delete-conflicting-outputs

      # Guard the drift schema snapshots BEFORE the build.
      #
      # `tool/fix_drift_schema_enums.ps1` exists because the enum defaults in
      # these schemas reference Dart types that are not in scope in a standalone
      # snapshot, so the migration test cannot compile. A future `drift_dev schema
      # generate` can reintroduce that silently, and an empty `versions` registry
      # (which `schema generate` produces on this project because it cannot map
      # the stored schema format) would disable the whole migration suite while
      # still looking green.
      #
      # The script is idempotent and self-checking: it fails if any snapshot
      # references an undefined enum, and if `schema.dart`'s version registry is
      # empty or missing a version.
      #
      # Run through `pwsh` explicitly rather than `shell: pwsh`, so the step does
      # not depend on the worksheet's default shell being PowerShell and the
      # failure mode is a clear "pwsh: command not found" rather than a silently
      # skipped guard. PowerShell 7 is preinstalled on the ubuntu-22.04 runner
      # image GitHub provides.
      - name: Verify drift schema snapshots
        run: pwsh -NoProfile -File ./tool/fix_drift_schema_enums.ps1

      - name: Verify database migrations
        run: flutter test test/drift/app_db/migration_test.dart

      # Resolve the version ONCE, from pubspec, and export it for both build
      # steps and for the verification step at the end.
      #
      # WHY: the About screen renders `"<buildNumber> (<version>)"` from
      # PackageInfo, which is the Android versionCode/versionName baked in at
      # build time. If the workflow passes --build-number/--build-name, those
      # OVERRIDE pubspec and the artifact can ship a version that does not match
      # the source it was built from. Reading pubspec here and passing nothing
      # unless the operator explicitly asked for an override makes the artifact
      # and the About screen the same number by construction.
      - name: Resolve version
        id: version
        run: |
          SPEC="$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//')"
          if [ -z "$SPEC" ]; then
            echo "::error::pubspec.yaml has no top-level 'version:' line"
            exit 1
          fi
          NAME="${SPEC%%+*}"
          CODE="${SPEC##*+}"
          if [ "$CODE" = "$SPEC" ]; then
            echo "::error::pubspec version '$SPEC' has no +buildNumber part"
            exit 1
          fi

          # An explicit input wins, so a specific upload can still be reproduced.
          if [ -n "${{ inputs.version_code }}" ]; then CODE="${{ inputs.version_code }}"; fi
          if [ -n "${{ inputs.version_name }}" ]; then NAME="${{ inputs.version_name }}"; fi

          case "$CODE" in
            ''|*[!0-9]*) echo "::error::versionCode '$CODE' must be a positive integer"; exit 1 ;;
          esac

          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "About screen will show: ${CODE} (${NAME})"
          {
            echo "### Version"
            echo ""
            echo '```'
            echo "versionName : ${NAME}"
            echo "versionCode : ${CODE}"
            echo "About screen: ${CODE} (${NAME})"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        if: ${{ inputs.format == 'apk' || inputs.format == 'both' }}
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          # --target-platform: build ONLY the ABIs this release ships.
          # android/app/build.gradle's release buildType pins abiFilters to
          # armeabi-v7a and arm64-v8a and packaging.jniLibs excludes
          # **/lib/x86 and **/lib/x86_64, so Flutter's default of
          # android-arm,android-arm64,android-x64 was compiling a whole x86_64
          # Rust toolchain through Cargokit purely to discard it. That waste is
          # what pushed the runner's disk to zero mid-compile.
          ARGS="--build-number ${{ steps.version.outputs.version_code }} --build-name ${{ steps.version.outputs.version_name }} --target-platform android-arm,android-arm64"
          # Verification builds only: the empty default leaves a real release
          # byte-identical to before this input existed.
          if [ -n "${{ inputs.dart_defines }}" ]; then
            echo "::warning::VERIFICATION BUILD - extra dart-defines: ${{ inputs.dart_defines }}. Do not upload this artifact to Play."
            IFS=',' read -ra EXTRA <<< "${{ inputs.dart_defines }}"
            for d in "${EXTRA[@]}"; do ARGS="$ARGS --dart-define=$(printf '%s' "$d" | xargs)"; done
          fi
          if [ "${{ inputs.split_per_abi }}" = "true" ]; then
            flutter build apk --release --flavor ${{ inputs.flavor }} $ARGS --split-per-abi
          else
            flutter build apk --release --flavor ${{ inputs.flavor }} $ARGS
          fi

      - name: Build App Bundle (Play upload)
        if: ${{ inputs.format == 'appbundle' || inputs.format == 'both' }}
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          # Same ABI reasoning as the APK step: the release buildType only ships
          # armeabi-v7a and arm64-v8a, so compiling x86_64 is wasted disk and
          # time for an artifact Play would never serve.
          BUNDLE_ARGS=""
          if [ -n "${{ inputs.dart_defines }}" ]; then
            echo "::warning::VERIFICATION BUILD - extra dart-defines: ${{ inputs.dart_defines }}. Do not upload this artifact to Play."
            IFS=',' read -ra EXTRA <<< "${{ inputs.dart_defines }}"
            for d in "${EXTRA[@]}"; do BUNDLE_ARGS="$BUNDLE_ARGS --dart-define=$(printf '%s' "$d" | xargs)"; done
          fi
          flutter build appbundle --release --flavor ${{ inputs.flavor }} \
            --build-number ${{ steps.version.outputs.version_code }} \
            --build-name ${{ steps.version.outputs.version_name }} \
            --target-platform android-arm,android-arm64 $BUNDLE_ARGS

      - name: List build outputs
        run: |
          echo "--- flutter-apk ---"
          find build/app/outputs/flutter-apk -type f -name '*.apk' -exec ls -lh {} \; 2>/dev/null || true
          echo "--- bundle ---"
          find build/app/outputs/bundle -type f -name '*.aab' -exec ls -lh {} \; 2>/dev/null || true

      # Verify the ARTIFACT, not the build log.
      #
      # The point of these steps is that "the build succeeded" says nothing about
      # what is inside the bundle. A Play AAB must carry the intended
      # versionCode/versionName and must be signed with the upload key. Both are
      # read back out of the produced file here, so a mismatch fails the run
      # rather than being discovered in the Play Console.
      - name: Verify AAB
        if: ${{ inputs.format == 'appbundle' || inputs.format == 'both' }}
        run: |
          AAB="$(find build/app/outputs/bundle -maxdepth 2 -type f -name '*.aab' | head -n1)"
          test -n "$AAB" || { echo "::error::No AAB produced"; exit 1; }
          echo "AAB      : $AAB"
          ls -lh "$AAB"
          echo "SHA-256  : $(sha256sum "$AAB" | awk '{print $1}')"

          # `bundletool` is the canonical tool for inspecting a bundle; the
          # Android SDK ships it. Fall back to unzipping the manifest if the SDK
          # path is unavailable, so the check never silently no-ops.
          BT="$(find "$ANDROID_HOME" -name 'bundletool*.jar' 2>/dev/null | head -n1)"
          if [ -n "$BT" ]; then
            echo "Using bundletool: $BT"
            java -jar "$BT" dump manifest --bundle "$AAB" > manifest.xml
            grep -E 'versionCode|versionName|package=' manifest.xml | head -n5
            ACTUAL_CODE="$(grep -oE 'versionCode="[0-9]+"' manifest.xml | head -n1 | grep -oE '[0-9]+')"
          else
            echo "::warning::bundletool not found; reading the version from the AAB's base manifest instead."
            unzip -o -q "$AAB" -d aab_extract
            ACTUAL_CODE="$(grep -aoE 'versionCode[^0-9]{0,8}[0-9]+' aab_extract/base/manifest/AndroidManifest.xml | head -n1 | grep -oE '[0-9]+$')"
          fi

          EXPECTED="${{ steps.version.outputs.version_code }}"
          echo "Expected versionCode: $EXPECTED"
          echo "Actual   versionCode: ${ACTUAL_CODE:-<unreadable>}"
          if [ "$ACTUAL_CODE" != "$EXPECTED" ]; then
            echo "::error::the AAB carries versionCode '${ACTUAL_CODE}' but '$EXPECTED' was requested"
            exit 1
          fi

      - name: Verify AAB signature
        if: ${{ inputs.format == 'appbundle' || inputs.format == 'both' }}
        run: |
          AAB="$(find build/app/outputs/bundle -maxdepth 2 -type f -name '*.aab' | head -n1)"
          # A Play upload must be signed with the UPLOAD key (Play re-signs with
          # the app signing key). An unsigned bundle is rejected by the Console.
          #
          # `jarsigner -verify` is the right tool for a bundle: it is a JAR, and
          # apksigner does not read .aab.
          jarsigner -verify -verbose -certs "$AAB" > js.txt 2>&1 || true
          if ! grep -qE 'jar verified|verified' js.txt; then
            echo "::error::the AAB is not signed"
            tail -n 40 js.txt
            exit 1
          fi
          echo "AAB is signed."
          grep -E 'CN=|SHA-256 digest' js.txt | head -n5
          {
            echo "### AAB signature"
            echo ""
            echo '```'
            grep -E 'jar verified|CN=' js.txt | head -n5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: ${{ inputs.format == 'apk' || inputs.format == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: soulful-bhakti-apk
          # Flavor-agnostic: the APK is app-<flavor>-release.apk, and
          # --split-per-abi appends -<abi>. Naming it after a fixed flavor here
          # is what would silently upload nothing for a dev build.
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB artifact
        if: ${{ inputs.format == 'appbundle' || inputs.format == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: soulful-bhakti-aab
          # build/app/outputs/bundle/<flavor>Release/app-<flavor>-release.aab
          path: build/app/outputs/bundle/*/*.aab

      - name: Audit shipped permissions (Data safety evidence)
        # The debug verification workflow audits its own APK. This audits the
        # artifact a RELEASE hands to Play, because that is the one Play Console's
        # Data safety answers describe, and the debug build is only a proxy for it.
        #
        # The permission that matters is com.google.android.gms.permission.AD_ID:
        # when it is merged, Play requires the "Device or other IDs -> Advertising
        # ID" declaration. It can arrive from a transitive AAR that nothing in this
        # repo declares, which is exactly how it got in once - a leftover
        # firebase-analytics Gradle dependency kept Google Analytics for Firebase
        # alive and pulled play-services-measurement in with it. See
        # docs/PLAY_DATA_SAFETY.md; the warning below is the tripwire for a repeat.
        run: |
          set -u
          APK="$(find build/app/outputs/flutter-apk -name '*.apk' 2>/dev/null | head -n1)"
          AAB="$(find build/app/outputs/bundle -maxdepth 2 -name '*.aab' 2>/dev/null | head -n1)"
          OUT="release-permissions.txt"
          {
            echo "apk: ${APK:-none}"
            echo "aab: ${AAB:-none}"
            echo "--- declared permissions ---"
            if [ -n "$APK" ]; then
              AAPT2="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name 'aapt2' 2>/dev/null | sort | tail -n1)"
              if [ -z "$AAPT2" ]; then
                echo "::error::aapt2 not found in the Android SDK; cannot read the release APK manifest."
                exit 1
              fi
              "$AAPT2" dump permissions "$APK" | sort -u
            elif [ -n "$AAB" ]; then
              # An AAB carries a protobuf manifest, so it is read with bundletool
              # rather than unzipped - the same tool the Verify AAB step uses.
              BT="$(find "$ANDROID_HOME" -name 'bundletool*.jar' 2>/dev/null | head -n1)"
              if [ -z "$BT" ]; then
                echo "::error::bundletool not found; cannot read the release AAB manifest."
                exit 1
              fi
              java -jar "$BT" dump manifest --bundle "$AAB" | grep -E 'uses-permission' | sort -u
            else
              echo "::error::Neither an APK nor an AAB was produced, so there is nothing to audit."
              exit 1
            fi
          } | tee "$OUT"
          echo "--- verdict ---"
          if grep -q 'com\.google\.android\.gms\.permission\.AD_ID' "$OUT"; then
            echo "::warning::AD_ID is present in the release artifact: Play requires the Data safety 'Device or other IDs -> Advertising ID' declaration. Keep docs/PLAY_DATA_SAFETY.md and the Console answer in sync."
          else
            echo "AD_ID is absent from the release artifact: no Advertising ID declaration is required."
          fi
          {
            echo "### Release artifact permissions"
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Signing material and the compile-time .env are written into the workspace
      # above. Remove them whatever happened, so an artifact or a subsequent step
      # can never pick them up.
      - name: Clean up secrets (always)
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks .env manifest.xml js.txt
          rm -f release-permissions.txt
          rm -rf aab_extract
          echo "Signing files and .env removed from the workspace."
