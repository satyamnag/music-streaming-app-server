name: Android Emulator Debug (logcat)

# Real-device debugging of the Soulful Bhakti app on a GitHub-hosted Android
# emulator. This is the complete debug loop CI: it builds the current debug
# APK from `main`, boots a hardware-accelerated emulator, installs and launches
# the app, drives a short interaction pass, and captures every debugging
# surface an engineer would want from logcat:
#
#   full_logcat.txt        entire log buffer (threadtime format)
#   filtered_logcat.txt    log buffer filtered to the requested level
#   app_logcat.txt         log stream restricted to the app's PID
#   crash_logcat.txt       dedicated crash buffer (AndroidRuntime etc.)
#   events_logcat.txt      system events buffer (am_crash / am_anr / am_kill)
#   findings.txt           auto-extracted FATAL/ANR/crash lines
#   dumpsys_processes.txt  activity/process state at capture time
#   meminfo.txt            memory usage of the app package
#   package_info.txt       installed package / version / flags
#   anr_traces.txt         /data/anr traces (best-effort, root emulator)
#
# Everything is uploaded as the "emulator-logcat" artifact.

on:
  workflow_dispatch:
    inputs:
      exercise_ui:
        description: Drive a short swipe/tap pass through the app while logging
        type: boolean
        default: true
      log_filter:
        description: Lowest logcat level kept in filtered_logcat.txt
        type: choice
        default: warning
        options:
          - verbose
          - debug
          - info
          - warning
          - error
          - assert
      # --- PostHog installation verification (optional) ---------------------
      # Collection is opt-in, so a normal install sends nothing and PostHog's
      # "Verify installation" step waits forever. Supplying a project token here
      # plus verify_analytics_optin=true builds a DEBUG APK that grants consent
      # itself and sends a labelled event, which is how the pipeline is proven
      # end to end. See docs/POSTHOG.md.
      #
      # The token is a public client-side ingest token - the same string ships
      # inside every APK - so it is not a secret in the API-key sense. It is
      # never committed; this workflow prints .env KEY NAMES only, never values.
      posthog_api_key:
        description: "PostHog project token (phc_...) for verification runs only. Empty = normal run."
        type: string
        default: ""
      posthog_host:
        description: PostHog ingest host (https://us.i.posthog.com or https://eu.i.posthog.com)
        type: string
        default: "https://us.i.posthog.com"
      verify_analytics_optin:
        description: >-
          Build with POSTHOG_VERIFY_OPTIN so this debug APK opts itself in to
          analytics. Refused by release builds by design.
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.35.2

jobs:
  emulator_logcat_debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write .env (compile-time config)
        env:
          DOTENV: ${{ secrets.DOTENV_RELEASE }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::warning::Secret DOTENV_RELEASE not set; using a minimal .env."
            printf '%s\n' \
              'SUPABASE_URL=https://placeholder.supabase.co' \
              'SUPABASE_ANON_KEY=placeholder-anon-key' \
              'CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsuc291bGZ1bGJoYWt0aS5jb20k' \
              'RELEASE_CHANNEL=nightly' \
              'ENABLE_UPDATE_CHECK=1' \
              'HIDE_DONATIONS=0' \
              > .env
          else
            printf '%s\n' "$DOTENV" > .env
            grep -oE '^[A-Z_]+' .env | sort -u
          fi

      - name: Add PostHog verification config
        # Resolution order, first match wins:
        #
        #   1. the `posthog_api_key` dispatch input  - one-off runs only
        #   2. the POSTHOG_VERIFY_KEY repository secret
        #   3. AWS Secrets Manager `posthog/api-key` (ap-south-1) - the same
        #      name android-release.yml reads
        #
        # Only the third is the release path; the first two exist so the
        # verification run needs no AWS access at all. Whichever was used is
        # named in the log, so a stale duplicate in the other location is
        # visible rather than silent.
        #
        # Never fails the job: no token simply leaves PostHog unconfigured,
        # which is the safe default - the SDK is not set up at all.
        #
        # No `if:` on this step on purpose: step-level conditionals cannot see
        # the `secrets` context, so the checks happen in shell.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
          POSTHOG_KEY_IN: ${{ inputs.posthog_api_key }}
          POSTHOG_HOST_IN: ${{ inputs.posthog_host }}
          POSTHOG_KEY_SECRET: ${{ secrets.POSTHOG_VERIFY_KEY }}
          POSTHOG_HOST_SECRET: ${{ secrets.POSTHOG_VERIFY_HOST }}
          VERIFY_OPTIN: ${{ inputs.verify_analytics_optin }}
        run: |
          set -u
          KEY="${POSTHOG_KEY_IN:-}"
          HOST="${POSTHOG_HOST_IN:-}"
          SOURCE="dispatch input"

          if [ -z "$KEY" ] && [ -n "${POSTHOG_KEY_SECRET:-}" ]; then
            KEY="$POSTHOG_KEY_SECRET"
            HOST="${HOST:-${POSTHOG_HOST_SECRET:-}}"
            SOURCE="repository secret POSTHOG_VERIFY_KEY"
          fi

          if [ -z "$KEY" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            KEY="$(aws secretsmanager get-secret-value --secret-id posthog/api-key --query SecretString --output text 2>/dev/null || true)"
            HOST="${HOST:-$(aws secretsmanager get-secret-value --secret-id posthog/host --query SecretString --output text 2>/dev/null || true)}"
            [ -n "$KEY" ] && SOURCE="AWS Secrets Manager"
          fi

          if [ -z "$KEY" ]; then
            if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
              echo "::warning::No PostHog token: no dispatch input, no POSTHOG_VERIFY_KEY secret, and no AWS credentials to read posthog/api-key. The verification build will run with analytics unconfigured, so no events will be sent."
            else
              echo "::warning::No PostHog token: no dispatch input and no POSTHOG_VERIFY_KEY secret, and posthog/api-key could not be read from ap-south-1 - it does not exist yet, or the IAM policy does not allow secretsmanager:GetSecretValue on it. The verification build will run with analytics unconfigured, so no events will be sent."
            fi
            exit 0
          fi

          # A secret is usually pasted wrong in one of two ways. Both would
          # otherwise surface only as "no events arrived", 20 minutes later.
          KEY="$(printf '%s' "$KEY" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "$KEY" in
            POSTHOG_API_KEY=*)
              echo "::warning::The stored token starts with 'POSTHOG_API_KEY='; stripping that prefix. Store only the phc_... value."
              KEY="${KEY#POSTHOG_API_KEY=}"
              ;;
          esac
          case "$KEY" in
            phc_*) ;;
            *) echo "::warning::The stored token does not start with 'phc_'. It may be a personal API key (phx_), a project id, or a placeholder. PostHog will reject it and no events will arrive." ;;
          esac

          printf 'POSTHOG_API_KEY=%s\n' "$KEY" >> .env
          printf 'POSTHOG_HOST=%s\n' "${HOST:-https://us.i.posthog.com}" >> .env
          echo "Appended POSTHOG_API_KEY and POSTHOG_HOST to .env from $SOURCE (values not shown)."
          if [ "$VERIFY_OPTIN" != "true" ]; then
            echo "::warning::A PostHog token was supplied without verify_analytics_optin=true. Analytics will be available but opted OUT, so no events will arrive until a user opts in."
          fi

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::warning::Signing secrets missing; generating an ephemeral debug keystore."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android999 -keypass android999 \
              -dname "CN=Android Debug, OU=CI, O=Soulful Bhakti, L=Temp, ST=Temp, C=IN" 2>/dev/null
            printf '%s\n' \
              'storeFile=upload-keystore.jks' \
              'storePassword=android999' \
              'keyAlias=debug' \
              'keyPassword=android999' \
              > android/key.properties
          else
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
            test -s android/app/upload-keystore.jks || { echo "::error::empty keystore"; exit 1; }
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (routes, drift, envied)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        # POSTHOG_VERIFY_OPTIN is passed ONLY on a verification dispatch, and it
        # is compiled in - a compile-time constant cannot be switched on at
        # runtime. PostHogService additionally requires kDebugMode, so a release
        # build refuses it even if this flag were ever wired into one.
        run: |
          ARGS=""
          if [ "${{ inputs.verify_analytics_optin }}" = "true" ]; then
            ARGS="--dart-define=POSTHOG_VERIFY_OPTIN=true"
            echo "::warning::POSTHOG_VERIFY_OPTIN is set: this debug APK grants analytics consent on launch so the pipeline can be verified."
          fi
          flutter build apk --debug --flavor stable $ARGS

      - name: Audit merged manifest permissions (Data safety evidence)
        # Play requires the "Device or other IDs -> Advertising ID" declaration
        # whenever the SHIPPED manifest carries
        # com.google.android.gms.permission.AD_ID - including when it arrives
        # transitively from a library rather than from this repo, which is how
        # firebase_analytics used to contribute it. That answer feeds the Play
        # Console Data safety form, so it is read off the APK this build just
        # produced instead of being inferred from the pubspec dependency list.
        #
        # aapt2 reads the APK's own binary manifest, so this keeps working when
        # the Gradle intermediate paths move - they did: Flutter puts them under
        # build/, not android/app/build/. The debug APK is the cheap build and
        # answers the same question, because
        # android/app/src/debug/AndroidManifest.xml adds only INTERNET, so no
        # debug-only source can add or hide a permission. permissions.txt is
        # picked up by the artifact upload below.
        #
        # The finding is not hypothetical: run 40189466351 shows AD_ID IS merged
        # into the shipped APK, from an AAR rather than from this repo.
        # docs/PLAY_DATA_SAFETY.md records what that obliges, and the blame
        # report printed at the end of this step names the SDK responsible.
        run: |
          set -u
          APK="$(find build/app/outputs -name '*.apk' 2>/dev/null | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found; cannot confirm whether an Advertising ID declaration is required."
            find build -maxdepth 4 -type d 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "APK: $APK"
          AAPT2="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name 'aapt2' 2>/dev/null | sort | tail -n1)"
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found in the Android SDK; cannot read the APK manifest."
            exit 1
          fi
          echo "aapt2: $AAPT2"
          {
            echo "apk: $APK"
            echo "--- declared permissions ---"
            "$AAPT2" dump permissions "$APK" | sort -u
          } | tee permissions.txt
          echo "--- verdict ---"
          if grep -q 'com\.google\.android\.gms\.permission\.AD_ID' permissions.txt; then
            echo "::warning::AD_ID is present in the shipped manifest: Play requires the Data safety 'Device or other IDs -> Advertising ID' declaration. Keep docs/PLAY_DATA_SAFETY.md and the Console answer in sync."
          else
            echo "AD_ID is absent: no Advertising ID declaration is required for this build."
          fi
          echo "--- which dependency contributes it ---"
          # Knowing THAT AD_ID is merged is not enough to act on: the developer
          # has to know which SDK wants the advertising ID before deciding
          # between declaring it and removing it with tools:node="remove". None
          # of this is visible from the pubspec, because the permission arrives
          # with an AAR rather than with a plugin's own manifest.
          #
          # Three lookups, deliberately overlapping, because the first attempt
          # guessed `find build -name 'manifest-merger-blame*report.txt' | head
          # -n1` and got a PLUGIN subproject's report, which named nothing:
          #   1. the app module's own blame report (exact path, if it holds)
          #   2. any blame report that actually mentions the permission, so a
          #      moved path cannot silently produce no answer
          #   3. the transformed AAR manifests, whose directory names ARE the
          #      artifact coordinates - the only lookup that names the SDK
          #      directly rather than by filename convention
          APPB="$(find build -path '*app/intermediates/manifest_merge_blame_file*' -name '*report.txt' 2>/dev/null | head -n1)"
          if [ -n "$APPB" ]; then
            echo "app blame report: $APPB"
            grep -n -B2 -A6 -E 'AD_ID|ACCESS_ADSERVICES' "$APPB" | head -n 80 || true
          else
            echo "::warning::No app-module blame report found."
          fi
          echo "--- blame reports that mention the permission ---"
          timeout 150 grep -rl 'permission\.AD_ID' build --include='*report.txt' 2>/dev/null | head -n 5 || true
          echo "--- transformed AAR manifests that mention the permission ---"
          timeout 240 grep -rl 'permission\.AD_ID' "$HOME/.gradle/caches" --include='AndroidManifest.xml' 2>/dev/null | head -n 10 || true
          echo "--- gradle cache layout ---"
          ls -d "$HOME"/.gradle/caches/* 2>/dev/null | head -n 10 || true
          echo "--- dependency chains that pull an ads or installreferrer artifact ---"
          # The artifact name says whats contributes the permission; the chain
          # says which SDK asked for it, which is the part that decides whether
          # removing it would break that SDK. Warm cache, so this resolves from
          # disk; a failure here is not allowed to fail the audit.
          if [ -x android/gradlew ]; then
            (
              cd android
              timeout 420 ./gradlew -q :app:dependencies --configuration stableDebugRuntimeClasspath 2>/dev/null \
                | grep -iE '^[+\\|].*(ads|installreferrer)' | sort -u | head -n 40
            ) || echo "(dependency report unavailable; see the transformed AAR manifests above)"
          fi

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run debug session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # Emulator options left at action defaults:
          # -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          # One command (not a multi-line script): the emulator action executes
          # the script line-by-line in fresh shells, so all logic lives in the
          # bash file.
          script: bash .github/scripts/android-emulator-debug.sh ${{ inputs.exercise_ui }} ${{ inputs.log_filter }}

      - name: Upload logcat artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: emulator-logcat
          path: |
            *.txt

      - name: Clean up signing material (always)
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks .env
          echo "Signing files and .env removed."