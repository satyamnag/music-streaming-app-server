name: Android Emulator Debug (logcat)

# Real-device debugging of the Soulful Bhakti app on a GitHub-hosted Android
# emulator. This is the complete debug loop CI: it builds the current debug
# APK from `main`, boots a hardware-accelerated emulator, installs and launches
# the app, drives a short interaction pass, and captures every debugging
# surface an engineer would want from logcat:
#
#   full_logcat.txt        entire log buffer (threadtime format)
#   filtered_logcat.txt    log buffer filtered to the requested level
#   app_logcat.txt         log stream restricted to the app's PID
#   crash_logcat.txt       dedicated crash buffer (AndroidRuntime etc.)
#   events_logcat.txt      system events buffer (am_crash / am_anr / am_kill)
#   findings.txt           auto-extracted FATAL/ANR/crash lines
#   dumpsys_processes.txt  activity/process state at capture time
#   meminfo.txt            memory usage of the app package
#   package_info.txt       installed package / version / flags
#   anr_traces.txt         /data/anr traces (best-effort, root emulator)
#
# Everything is uploaded as the "emulator-logcat" artifact.

on:
  workflow_dispatch:
    inputs:
      exercise_ui:
        description: Drive a short swipe/tap pass through the app while logging
        type: boolean
        default: true
      log_filter:
        description: Lowest logcat level kept in filtered_logcat.txt
        type: choice
        default: warning
        options:
          - verbose
          - debug
          - info
          - warning
          - error
          - assert

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.35.2

jobs:
  emulator_logcat_debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write .env (compile-time config)
        env:
          DOTENV: ${{ secrets.DOTENV_RELEASE }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::warning::Secret DOTENV_RELEASE not set; using a minimal .env."
            printf '%s\n' \
              'SUPABASE_URL=https://placeholder.supabase.co' \
              'SUPABASE_ANON_KEY=placeholder-anon-key' \
              'CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsuc291bGZ1bGJoYWt0aS5jb20k' \
              'RELEASE_CHANNEL=nightly' \
              'ENABLE_UPDATE_CHECK=1' \
              'HIDE_DONATIONS=0' \
              > .env
          else
            printf '%s\n' "$DOTENV" > .env
            grep -oE '^[A-Z_]+' .env | sort -u
          fi

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::warning::Signing secrets missing; generating an ephemeral debug keystore."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android999 -keypass android999 \
              -dname "CN=Android Debug, OU=CI, O=Soulful Bhakti, L=Temp, ST=Temp, C=IN" 2>/dev/null
            printf '%s\n' \
              'storeFile=upload-keystore.jks' \
              'storePassword=android999' \
              'keyAlias=debug' \
              'keyPassword=android999' \
              > android/key.properties
          else
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
            test -s android/app/upload-keystore.jks || { echo "::error::empty keystore"; exit 1; }
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (routes, drift, envied)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug --flavor stable

      - name: Boot emulator and run debug session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-audio
          script: |
            set -euo pipefail
            export APK=build/app/outputs/flutter-apk/app-stable-debug.apk
            export PKG=com.soulfulbhakti.app
            export ACT=com.sangeet.app/.MainActivity

            adb wait-for-device
            # google_apis image: root lets us read /data/anr (best-effort).
            adb root || true
            adb wait-for-device
            adb shell input keyevent 82 || true   # dismiss keyguard

            echo "::group::Install and launch"
            adb install -t -r "$APK"
            adb logcat -c
            adb shell am start -W -n "$ACT" || true
            APP_PID=""
            for i in $(seq 1 30); do
              APP_PID=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)
              [ -n "$APP_PID" ] && break
              sleep 2
            done
            echo "APP_PID=${APP_PID:-NOT RUNNING}"
            # Let the splash gate + first data load settle.
            sleep 10
            echo "::endgroup::"

            if [ "${{ inputs.exercise_ui }}" = "true" ]; then
              echo "::group::UI exercise (swipe + navigation, all best-effort)"
              adb shell input swipe 540 1600 540 600 400 || true
              sleep 2
              adb shell input tap 945 2280 || true   # bottom-nav "Stats" tile
              sleep 3
              adb shell input tap 1000 180 || true   # top-right avatar -> profile popup
              sleep 3
              adb shell input keyevent 4 || true     # back
              sleep 2
              adb shell input keyevent 4 || true     # back again
              sleep 2
              echo "::endgroup::"
            fi

            echo "::group::Capture debugging logs"
            adb logcat -d -v threadtime > full_logcat.txt || true
            adb logcat -d -v threadtime --pid="${APP_PID}" > app_logcat.txt 2>/dev/null || true
            adb logcat -d -b crash -v threadtime > crash_logcat.txt || true
            adb logcat -d -b events -v threadtime > events_logcat.txt || true
            LVL="${{ inputs.log_filter }}"
            case "$LVL" in
              verbose) LP=V;; debug) LP=D;; info) LP=I;;
              warning) LP=W;; error) LP=E;; assert) LP=A;;
              *) LP=W;;
            esac
            adb logcat -d -v threadtime "*:$LP" > filtered_logcat.txt || true
            adb shell dumpsys activity processes > dumpsys_processes.txt || true
            adb shell dumpsys meminfo "$PKG" > meminfo.txt || true
            adb shell dumpsys package "$PKG" > package_info.txt || true
            adb shell "cat /data/anr/traces.txt 2>/dev/null" > anr_traces.txt || true
            echo "::endgroup::"

            echo "::group::Debug summary"
            echo "full log lines : $(wc -l < full_logcat.txt 2>/dev/null || echo 0)"
            echo "app log lines  : $(wc -l < app_logcat.txt 2>/dev/null || echo 0)"
            echo "crash log lines: $(wc -l < crash_logcat.txt 2>/dev/null || echo 0)"
            grep -E "FATAL EXCEPTION|AndroidRuntime|ANR in |am_crash|am_anr|am_kill|Process: com\.soulfulbhakti|E flutter" \
              full_logcat.txt crash_logcat.txt events_logcat.txt 2>/dev/null \
              | head -200 > findings.txt || true
            echo "--- top findings ---"
            head -60 findings.txt 2>/dev/null || true
            echo "--- app-pid log (tail) ---"
            tail -40 app_logcat.txt 2>/dev/null || true
            echo "::endgroup::"

      - name: Upload logcat artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: emulator-logcat
          path: |
            *.txt

      - name: Clean up signing material (always)
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks .env
          echo "Signing files and .env removed."