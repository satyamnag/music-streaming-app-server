name: Android Emulator Debug (logcat)

# Real-device debugging of the Soulful Bhakti app on a GitHub-hosted Android
# emulator. This is the complete debug loop CI: it builds the current debug
# APK from `main`, boots a hardware-accelerated emulator, installs and launches
# the app, drives a short interaction pass, and captures every debugging
# surface an engineer would want from logcat:
#
#   full_logcat.txt        entire log buffer (threadtime format)
#   filtered_logcat.txt    log buffer filtered to the requested level
#   app_logcat.txt         log stream restricted to the app's PID
#   crash_logcat.txt       dedicated crash buffer (AndroidRuntime etc.)
#   events_logcat.txt      system events buffer (am_crash / am_anr / am_kill)
#   findings.txt           auto-extracted FATAL/ANR/crash lines
#   dumpsys_processes.txt  activity/process state at capture time
#   meminfo.txt            memory usage of the app package
#   package_info.txt       installed package / version / flags
#   anr_traces.txt         /data/anr traces (best-effort, root emulator)
#
# Everything is uploaded as the "emulator-logcat" artifact.

on:
  workflow_dispatch:
    inputs:
      exercise_ui:
        description: Drive a short swipe/tap pass through the app while logging
        type: boolean
        default: true
      log_filter:
        description: Lowest logcat level kept in filtered_logcat.txt
        type: choice
        default: warning
        options:
          - verbose
          - debug
          - info
          - warning
          - error
          - assert
      # --- PostHog installation verification (optional) ---------------------
      # Collection is opt-in, so a normal install sends nothing and PostHog's
      # "Verify installation" step waits forever. Supplying a project token here
      # plus verify_analytics_optin=true builds a DEBUG APK that grants consent
      # itself and sends a labelled event, which is how the pipeline is proven
      # end to end. See docs/POSTHOG.md.
      #
      # The token is a public client-side ingest token - the same string ships
      # inside every APK - so it is not a secret in the API-key sense. It is
      # never committed; this workflow prints .env KEY NAMES only, never values.
      posthog_api_key:
        description: "PostHog project token (phc_...) for verification runs only. Empty = normal run."
        type: string
        default: ""
      posthog_host:
        description: PostHog ingest host (https://us.i.posthog.com or https://eu.i.posthog.com)
        type: string
        default: "https://us.i.posthog.com"
      verify_analytics_optin:
        description: >-
          Build with POSTHOG_VERIFY_OPTIN so this debug APK opts itself in to
          analytics. Refused by release builds by design.
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.35.2

jobs:
  emulator_logcat_debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write .env (compile-time config)
        env:
          DOTENV: ${{ secrets.DOTENV_RELEASE }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::warning::Secret DOTENV_RELEASE not set; using a minimal .env."
            printf '%s\n' \
              'SUPABASE_URL=https://placeholder.supabase.co' \
              'SUPABASE_ANON_KEY=placeholder-anon-key' \
              'CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsuc291bGZ1bGJoYWt0aS5jb20k' \
              'RELEASE_CHANNEL=nightly' \
              'ENABLE_UPDATE_CHECK=1' \
              'HIDE_DONATIONS=0' \
              > .env
          else
            printf '%s\n' "$DOTENV" > .env
            grep -oE '^[A-Z_]+' .env | sort -u
          fi

      - name: Add PostHog verification config from AWS Secrets Manager
        # PostHog credentials live in AWS Secrets Manager (ap-south-1) as
        # `posthog/api-key` and `posthog/host` - the SAME two names the release
        # workflow reads - so there is one home for them, not a GitHub secret
        # copy that can drift out of sync.
        #
        # Never fails the job: no secret or no AWS credential simply leaves
        # PostHog unconfigured, which is the safe default (the SDK is not set up
        # at all). A dispatch input can still override, for a one-off run.
        #
        # No `if:` on this step on purpose: step-level conditionals cannot see
        # the `secrets` context, so the checks happen in shell.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
          POSTHOG_KEY_IN: ${{ inputs.posthog_api_key }}
          POSTHOG_HOST_IN: ${{ inputs.posthog_host }}
          VERIFY_OPTIN: ${{ inputs.verify_analytics_optin }}
        run: |
          set -u
          KEY="${POSTHOG_KEY_IN:-}"
          HOST="${POSTHOG_HOST_IN:-}"
          SOURCE="dispatch input"
          if [ -z "$KEY" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            KEY="$(aws secretsmanager get-secret-value --secret-id posthog/api-key --query SecretString --output text 2>/dev/null || true)"
            HOST="$(aws secretsmanager get-secret-value --secret-id posthog/host --query SecretString --output text 2>/dev/null || true)"
            SOURCE="AWS Secrets Manager"
          fi
          if [ -z "$KEY" ]; then
            if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
              echo "::warning::No PostHog token: no dispatch input, and no AWS credentials are configured to read posthog/api-key from ap-south-1. The verification build will run with analytics unconfigured, so no events will be sent."
            else
              echo "::warning::No PostHog token: no dispatch input, and posthog/api-key could not be read from ap-south-1 - the secret does not exist yet, or the IAM policy does not allow secretsmanager:GetSecretValue on it. The verification build will run with analytics unconfigured, so no events will be sent."
            fi
            exit 0
          fi
          printf 'POSTHOG_API_KEY=%s\n' "$KEY" >> .env
          printf 'POSTHOG_HOST=%s\n' "${HOST:-https://us.i.posthog.com}" >> .env
          echo "Appended POSTHOG_API_KEY and POSTHOG_HOST to .env from $SOURCE (values not shown)."
          if [ "$VERIFY_OPTIN" != "true" ]; then
            echo "::warning::A PostHog token was supplied without verify_analytics_optin=true. Analytics will be available but opted OUT, so no events will arrive until a user opts in."
          fi

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::warning::Signing secrets missing; generating an ephemeral debug keystore."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android999 -keypass android999 \
              -dname "CN=Android Debug, OU=CI, O=Soulful Bhakti, L=Temp, ST=Temp, C=IN" 2>/dev/null
            printf '%s\n' \
              'storeFile=upload-keystore.jks' \
              'storePassword=android999' \
              'keyAlias=debug' \
              'keyPassword=android999' \
              > android/key.properties
          else
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
            test -s android/app/upload-keystore.jks || { echo "::error::empty keystore"; exit 1; }
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (routes, drift, envied)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        # POSTHOG_VERIFY_OPTIN is passed ONLY on a verification dispatch, and it
        # is compiled in - a compile-time constant cannot be switched on at
        # runtime. PostHogService additionally requires kDebugMode, so a release
        # build refuses it even if this flag were ever wired into one.
        run: |
          ARGS=""
          if [ "${{ inputs.verify_analytics_optin }}" = "true" ]; then
            ARGS="--dart-define=POSTHOG_VERIFY_OPTIN=true"
            echo "::warning::POSTHOG_VERIFY_OPTIN is set: this debug APK grants analytics consent on launch so the pipeline can be verified."
          fi
          flutter build apk --debug --flavor stable $ARGS

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run debug session
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # Emulator options left at action defaults:
          # -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          # One command (not a multi-line script): the emulator action executes
          # the script line-by-line in fresh shells, so all logic lives in the
          # bash file.
          script: bash .github/scripts/android-emulator-debug.sh ${{ inputs.exercise_ui }} ${{ inputs.log_filter }}

      - name: Upload logcat artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: emulator-logcat
          path: |
            *.txt

      - name: Clean up signing material (always)
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks .env
          echo "Signing files and .env removed."