name: Sync all tracks (catalogue-wide)

# Applies the verified Kavalini pipeline to the whole catalogue:
#   segment Whisper's measured words -> one cue per sung occurrence
#   -> audit against the audio -> render EN / EN-TR from the SAME timeline
#   -> write ONLY when every hard check passes AND the new timeline has strictly
#      more sung cues than the stored one.
#
# PLAIN LYRICS ARE NEVER WRITTEN. Only synced_lyrics / _en / _en_tr.
#
# The heavy compute (Whisper over ~6 hours of audio) runs on Modal and its output
# is committed as whisper-words.json; this job does the deterministic
# segmentation, validation and write, so the write path is auditable and
# reproducible from the repo.
#
# SAFETY
#   * default is a DRY RUN - set `write` explicitly.
#   * every track's previous synced_lyrics* values are captured to
#     sync-all-backup.json BEFORE its PATCH (uploaded as an artifact).
#   * a track that fails any check, or gains no sung cues, is left untouched.

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Write the rebuilt columns to the database (leave false for a dry run)'
        type: boolean
        default: false
      limit:
        description: 'Only process the first N tracks (0 = all)'
        required: false
        default: '0'
      ids:
        description: 'Comma-separated track ids to restrict to (blank = all)'
        required: false
        default: ''
      refine:
        description: 'Also rewrite when the cue count is unchanged but the boundaries are measurably better'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-all-tracks
  cancel-in-progress: false

jobs:
  sync:
    name: Sync all tracks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WRITE_FLAG: ${{ inputs.write }}
      LIMIT: ${{ inputs.limit }}
      IDS: ${{ inputs.ids }}
      REFINE_FLAG: ${{ inputs.refine }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Supabase URL (masked)
        run: |
          set -eu
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set"; exit 1
          fi
          SUPA_URL="$(aws secretsmanager get-secret-value --secret-id supabase/url --query SecretString --output text)"
          if [ -z "$SUPA_URL" ]; then echo "::error::supabase/url came back empty"; exit 1; fi
          echo "::add-mask::$SUPA_URL"
          echo "SUPABASE_URL=$SUPA_URL" >> "$GITHUB_ENV"

      - name: Sync
        working-directory: server/tools
        run: |
          set -eu
          ARGS="--out-dir sync-out"
          if [ "$WRITE_FLAG" = "true" ]; then ARGS="$ARGS --write"; fi
          if [ "${REFINE_FLAG:-false}" = "true" ]; then ARGS="$ARGS --refine"; fi
          if [ -n "${LIMIT:-}" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "${IDS:-}" ]; then ARGS="$ARGS --ids $IDS"; fi
          node sync-all-tracks.mjs $ARGS | tee sync.log

      - name: Verify written tracks (read-back)
        if: always()
        working-directory: server/tools
        run: |
          set -eu
          if [ -f sync-out/sync-all-report.json ]; then
            node -e '
              const r = require("./sync-out/sync-all-report.json");
              console.log("mode", r.mode, "| would_write", r.would_write, "| written", r.written,
                          "| keep", r.skipped, "| errors", r.errors);
              const bad = r.detail.filter((d) => d.status === "error");
              if (bad.length) { console.error("errors:", bad.map((b) => b.title + ": " + b.reason).join("; ")); process.exit(1); }
            '
          fi

      - name: Upload report + backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-all-tracks
          path: |
            server/tools/sync.log
            server/tools/sync-out/sync-all-report.json
            server/tools/sync-out/sync-all-backup.json
            server/tools/sync-out/sync-all-payload.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sync all tracks"
            echo ""
            echo "Mode: **$([ "$WRITE_FLAG" = "true" ] && echo WRITE || echo DRY RUN)**"
            echo ""
            if [ -f server/tools/sync-out/sync-all-report.json ]; then
              node -e '
                const r = require("./server/tools/sync-out/sync-all-report.json");
                console.log("| metric | value |");
                console.log("|---|---|");
                console.log(`| tracks | ${r.tracks} |`);
                console.log(`| would write | ${r.would_write} |`);
                console.log(`| written | ${r.written} |`);
                console.log(`| kept (no gain) | ${r.skipped} |`);
                console.log(`| errors | ${r.errors} |`);
              '
            fi
            echo ""
            echo "Plain lyrics were not modified. Only \`synced_lyrics*\` columns are written."
          } >> "$GITHUB_STEP_SUMMARY"
