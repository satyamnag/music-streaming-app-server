name: Build 3-language sync lyrics from an uploaded SRT

# The production pipeline behind the admin "Build from SRT" action.
#
# The admin writes the uploaded SRT into the track's `synced_lyrics`; this job reads it
# back as the alignment SCRIPT, aligns it to the real audio with WhisperX, reconciles it
# against an independent Whisper transcript, derives the {{Music}} cues, renders the
# English translation and transliteration from the plain columns, and writes all three
# columns in ONE PATCH with a backup.
#
# `srt_path` is an alternative source for the script: a committed file under
# server/tools/inputs/. It is used so a track whose sync columns are still EMPTY can be
# built without staging an untimed SRT into the database first. The DB is still not
# touched until finalize_payload has validated the finished timeline.
#
# SAFETY
#   * `write` defaults to false: a run without it validates only.
#   * prepare refuses unless every cue is an EXACT plain-lyric line.
#   * finalize refuses unless the three columns share one timeline, are contiguous,
#     span 0 -> duration, and every sung cue carries text in all three.
#   * the current three columns are backed up before the PATCH, and the row is re-read
#     and compared byte-for-byte afterwards.
#
# Compute stays here: WhisperX alignment plus a large-v3 ASR cross-check.

on:
  workflow_dispatch:
    inputs:
      track_id:
        description: 'Supabase track id (its synced_lyrics must already hold the uploaded SRT, unless srt_path is set)'
        required: true
        default: '6bae22b4-73e4-4216-8477-c3634d1911be'
      srt_path:
        description: 'Optional repo path to the SRT (e.g. server/tools/inputs/X.source.srt). When set it is used instead of synced_lyrics, so nothing is staged into the database.'
        required: false
        default: ''
      segments_from:
        description: 'Optional repo path to the SAME SRT used as per-line windows (windowed alignment). Use it when the supplied cues are close to right, so each line is placed inside its own neighbourhood instead of across the whole track.'
        required: false
        default: ''
      write:
        description: 'Write the three columns. Leave false to validate only.'
        type: boolean
        default: false
      shift:
        description: 'Optional constant offset in seconds for all columns, e.g. -0.5'
        required: false
        default: '0'
      music_gap:
        description: 'Gaps at least this long become a {{Music}} cue'
        required: false
        default: '3.0'
      max_music_fraction:
        description: 'Refuse to write if one {{Music}} cue covers more than this share of the track (0.25 = 25%)'
        required: false
        default: '0.25'
      allow_uncued_lines:
        description: 'Only for a plain-lyric row that is not a sung line at all (a section/raga heading). Otherwise the run refuses to omit a line.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-from-srt-${{ inputs.track_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Align, reconcile, render, write
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRACK_ID: ${{ inputs.track_id }}
      SRT_PATH: ${{ inputs.srt_path }}
      SEGMENTS_FROM: ${{ inputs.segments_from }}
      WRITE_FLAG: ${{ inputs.write }}
      SHIFT: ${{ inputs.shift }}
      MUSIC_GAP: ${{ inputs.music_gap }}
      MAX_MUSIC_FRACTION: ${{ inputs.max_music_fraction }}
      ALLOW_UNCUED_LINES: ${{ inputs.allow_uncued_lines }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WhisperX (CPU)
        run: |
          set -eu
          python -m pip install --upgrade pip
          # whisperx 3.8.6 requires torch~=2.8.0; torch, torchaudio AND torchvision
          # must all be CPU builds or Wav2Vec2ForCTC fails to import.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0
          python -m pip install whisperx imageio-ffmpeg
          python -c "import importlib.metadata as m, torch; print('whisperx', m.version('whisperx'), '| torch', torch.__version__)"

      - name: Resolve secrets (masked)
        run: |
          set -eu
          SUPA_URL="$(aws secretsmanager get-secret-value --secret-id supabase/url --query SecretString --output text)"
          ANON="$(aws secretsmanager get-secret-value --secret-id supabase/anon-key --query SecretString --output text)"
          R2="$(aws secretsmanager get-secret-value --secret-id r2/base-url --query SecretString --output text)"
          if [ -z "$SUPA_URL" ] || [ -z "$ANON" ] || [ -z "$R2" ]; then echo "::error::missing secrets"; exit 1; fi
          echo "::add-mask::$SUPA_URL"; echo "::add-mask::$ANON"; echo "::add-mask::$R2"
          {
            echo "SUPABASE_URL=$SUPA_URL"
            echo "SUPABASE_ANON_KEY=$ANON"
            echo "R2_BASE_URL=$R2"
          } >> "$GITHUB_ENV"

      - name: Prepare the alignment script from the uploaded SRT
        working-directory: server/tools
        run: |
          set -euo pipefail
          if [ -n "${SRT_PATH:-}" ]; then
            node prepare_srt_job.mjs --track "$TRACK_ID" --srt-file "$GITHUB_WORKSPACE/$SRT_PATH" --out-dir out | tee prepare.log
          else
            node prepare_srt_job.mjs --track "$TRACK_ID" --out-dir out | tee prepare.log
          fi

      - name: WhisperX alignment
        working-directory: server/tools
        run: |
          set -euo pipefail
          URL="$(node -e 'console.log(require("./out/job.json").audio_url)')"
          DURATION="$(node -e 'console.log(require("./out/job.json").duration)')"
          if [ -n "${SEGMENTS_FROM:-}" ]; then
            python whisperx_align_script.py --url "$URL" --srt out/script.srt \
              --duration "$DURATION" --music-gap "$MUSIC_GAP" \
              --segments-from "$GITHUB_WORKSPACE/$SEGMENTS_FROM" \
              --out-dir out 2>&1 | tee align.log
          else
            python whisperx_align_script.py --url "$URL" --srt out/script.srt \
              --duration "$DURATION" --music-gap "$MUSIC_GAP" --out-dir out 2>&1 | tee align.log
          fi

      - name: Independent Whisper cross-check
        working-directory: server/tools
        run: |
          set -euo pipefail
          URL="$(node -e 'console.log(require("./out/job.json").audio_url)')"
          python whisper_crosscheck.py --url "$URL" \
            --srt "$(ls out/*.aligned.srt | head -n 1)" --out-dir out 2>&1 | tee crosscheck.log

      - name: Reconcile against the ASR evidence
        working-directory: server/tools
        run: |
          set -euo pipefail
          DURATION="$(node -e 'console.log(require("./out/job.json").duration)')"
          python reconcile_timeline.py \
            --aligned "$(ls out/*.aligned.srt | head -n 1)" \
            --words out/whisper-words.json \
            --duration "$DURATION" --music-gap "$MUSIC_GAP" \
            --out out/final.srt --report out/reconcile-report.json | tee reconcile.log

      - name: Render English translation + transliteration from the plain columns
        working-directory: server/tools
        run: |
          set -euo pipefail
          node render-variant-sync.mjs --track "$TRACK_ID" --cols en,en_tr \
            --timeline-file out/final.srt --out-dir out --emit-payload | tee render.log

      - name: Validate, then write all three columns
        working-directory: server/tools
        run: |
          set -euo pipefail
          DURATION="$(node -e 'console.log(require("./out/job.json").duration)')"
          # The script's own cue count is the number of sung cues the timeline must carry.
          # If the aligner drops an occurrence, finalize refuses to write.
          CUES="$(node -e 'console.log(require("./out/job.json").cues)')"
          ARGS="--track $TRACK_ID --final out/final.srt --variant out/payload.json --duration $DURATION --shift $SHIFT --expect-lyric-cues $CUES --max-music-fraction ${MAX_MUSIC_FRACTION:-0.25}"
          if [ "${ALLOW_UNCUED_LINES:-false}" = "true" ]; then ARGS="$ARGS --allow-uncued-lines"; fi
          node finalize_payload.mjs $ARGS | tee finalize-dry.log
          if [ "${WRITE_FLAG:-false}" = "true" ]; then
            node finalize_payload.mjs $ARGS --write | tee finalize-write.log
          else
            echo "validate-only run (write=false) - nothing written"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-from-srt
          path: |
            server/tools/prepare.log
            server/tools/align.log
            server/tools/crosscheck.log
            server/tools/reconcile.log
            server/tools/render.log
            server/tools/finalize-dry.log
            server/tools/finalize-write.log
            server/tools/sync-from-srt-backup.json
            server/tools/out/
          if-no-files-found: warn
