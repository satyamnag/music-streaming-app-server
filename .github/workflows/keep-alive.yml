name: Keep Render Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render free web service
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -o /dev/null \
            https://music-streaming-app-server.onrender.com/api/albums