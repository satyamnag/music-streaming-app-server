# ---------------------------------------------------------------------------
# CI build-time flags (measured against the v81 baseline, not assumed)
#
# The Android Release Build spends ~11m41s of its ~15m in the single `Build APK`
# step, so that step is the only lever worth pulling. `actions/setup-java` with
# `cache: gradle` already caches ~/.gradle/caches/modules-2 (the dependency
# cache, 3.90 GiB, confirmed present) plus the wrapper distribution. These two
# flags cover the OTHER half of Gradle's caching, which that cache does not:
#
#   org.gradle.parallel=true
#     Lets independent projects/tasks in this multi-module build run
#     concurrently. This build has no inter-project task-ordering constraints
#     that parallel execution would violate - Gradle still honours declared
#     task dependencies, so the task graph is unchanged. Outputs are
#     byte-identical; only the scheduling changes.
#
#   org.gradle.caching=true
#     Enables Gradle's build cache for task outputs. On ephemeral CI runners this
#     is a smaller win than on a dev machine, because the cache starts empty and
#     only helps tasks Gradle can key on unchanged inputs. It is enabled for the
#     same reason the dependency cache is: it is free correctness-wise. The cache
#     is keyed by a hash of task inputs, so a cache HIT is by definition an
#     identical result, and a miss simply runs the task as before. It cannot
#     change what is built.
#
# Deliberately NOT enabled: org.gradle.configuration-cache=true. It is the
# fastest of the three, but it is not transparent: plugins that read the
# environment or touch the filesystem at configuration time are rejected by it
# at build time. This project applies google-services, firebase-crashlytics and
# the Kotlin Compose plugin, and a failure there breaks the release build
# outright. It is left off until it can be verified against a real run.
# ---------------------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
