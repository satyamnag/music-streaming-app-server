# ---------------------------------------------------------------------------
# CI build-time flags — MEASURED, AND REVERTED. Read before re-adding.
#
# `org.gradle.parallel=true` was tried here to cut the ~11m41s `Build APK` step
# (the single dominant cost in the ~15m build). IT BREAKS THE RELEASE BUILD.
# Do not re-add it without reading this.
#
# Why it breaks: this project has TWO cargokit/Rust plugins — flutter_discord_rpc
# and metadata_god — and neither the release workflow nor android-debug.yml sets
# up a Rust toolchain, because android-debug.yml documents the assumption that
# "cargokit-plugins auto-install their Rust targets via rustup, so no separate
# Rust setup step is required." That assumption only holds when the plugins run
# one after another.
#
# Under parallel execution both plugins call `rustup target add` for the SAME
# targets at the SAME time. rustup mutates a single shared ~/.rustup directory,
# so the two installs collide:
#
#   error: failed to install component: 'rust-std-armv7-linux-androideabi',
#   detected conflict: 'lib/rustlib/armv7-linux-androideabi/lib/libaddr2line-*.rlib'
#
# Evidence this is caused by the flag and not by flaky infrastructure: the same
# commit 24b25241 was run twice and failed both times, with two DIFFERENT rustup
# errors (a download rename failure, then a component conflict). The successful
# v81 run (commit 425b1630, without this flag) serialised the plugins cleanly —
# "Building flutter_discord_rpc for x86_64" completed at 11:58:09, and only then
# did metadata_god start at 11:58:31. The failure follows the flag, not the commit.
#
# The real fix, if parallel is wanted later, is to install the Rust targets ONCE
# up front (dtolnay/rust-toolchain with explicit `targets:` for
# armv7-linux-androideabi, aarch64-linux-android, x86_64-linux-android) so no
# plugin ever races on rustup. That is how spotube-release-binary.yml does it.
# Until that step exists, this build must stay serial.
#
# org.gradle.caching=true is left ON: it is content-keyed and was not implicated
# in the failure, but it was never measured in isolation either, so its benefit
# here is unproven rather than established.
# ---------------------------------------------------------------------------
org.gradle.caching=true
