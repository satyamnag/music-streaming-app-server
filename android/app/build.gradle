plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.plugin.compose"
    // Firebase (Crashlytics only)
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def composeVersion = "1.4.8"

android {
    namespace "com.sangeet.app"
    
    compileSdkVersion 36

    ndkVersion = "29.0.14206865"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.soulfulbhakti.app"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        // Clerk publishable key for Application.onCreate() initialization.
        // Publishable keys are public (meant for client apps) — safe to embed here.
        // Flutter's Gradle plugin doesn't pass custom gradle.properties via project.findProperty,
        // so we reference the property directly. Keep in sync with .env CLERK_PUBLISHABLE_KEY.
        def clerkKey = project.hasProperty('CLERK_PUBLISHABLE_KEY') ? project.property('CLERK_PUBLISHABLE_KEY') : 'pk_live_Y2xlcmsuc291bGZ1bGJoYWt0aS5jb20k'
        buildConfigField "String", "CLERK_PUBLISHABLE_KEY", "\"${clerkKey}\""
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Enable Crashlytics native symbol upload so native stack traces
            // are symbolicated in the Crashlytics dashboard.
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
            }
            // Release stays slim: ARM-only ABIs (as before).
            ndk {
                abiFilters.clear()
                abiFilters.addAll(["armeabi-v7a", "arm64-v8a"])
            }
            packaging {
                jniLibs {
                    excludes += "**/lib/x86/**"
                    excludes += "**/lib/x86_64/**"
                }
            }
        }
        debug {
            signingConfig signingConfigs.release
            // Debug includes all ABIs so x86_64 emulators can install and run.
            ndk {
                abiFilters.clear()
                abiFilters.addAll(["armeabi-v7a", "arm64-v8a", "x86_64"])
            }
        }
    }

    flavorDimensions "default"

    productFlavors {
        nightly {
            dimension "default"
            resValue "string", "app_name_en", "Soulful Bhakti Nightly"
            applicationIdSuffix ".nightly"
            versionNameSuffix "-nightly"
            signingConfig signingConfigs.release
        }
        dev {
            dimension "default"
            resValue "string", "app_name_en", "Soulful Bhakti Dev"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            signingConfig signingConfigs.release
        }
        stable {
            dimension "default"
            resValue "string", "app_name_en", "Soulful Bhakti"
            signingConfig signingConfigs.release
        }
    }

    packaging {
        resources {
            excludes += "DebugProbesKt.bin"
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }
}

flutter {
    source '../..'
}

def glanceVersion = "1.1.1"
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    // other deps so just ignore
    implementation 'com.android.support:multidex:2.0.1'

    // Clerk Android SDK (Native API)
    implementation 'com.clerk:clerk-android-api:1.0.39'

    // Google Play Install Referrer (affiliate QR attribution). Read explicitly
    // (not transitively) so the referrer bridge never depends on Superwall's
    // internal dependency graph.
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Google Play Billing Library (in-app purchases & subscriptions)
    // NOTE: keep at 8.0.0 — Superwall's native Android SDK (superwall-android)
    // is compiled against billing 8.0.0 and references SkuDetails /
    // QueryPurchaseHistoryParams which were REMOVED in billing 9.x.
    implementation 'com.android.billingclient:billing:8.0.0'

    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "androidx.glance:glance-appwidget-preview:$glanceVersion"
    implementation "androidx.glance:glance-preview:$glanceVersion"
    implementation "androidx.glance:glance-material3:$glanceVersion"
    implementation "androidx.glance:glance-material:$glanceVersion"
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation 'com.google.code.gson:gson:2.11.0'

    // Firebase BoM (matches the FlutterFire-managed BOM version 34.17.0, so
    // Gradle deduplicates).
    implementation platform('com.google.firebase:firebase-bom:34.17.0')

    // Google Analytics for Firebase (GA4).
    //
    // ## Why this is declared again
    // It was removed once, on purpose, because it was the only artifact pulling
    // play-services-measurement into the APK - which is what merges
    // com.google.android.gms.permission.AD_ID and the two Privacy Sandbox
    // ACCESS_ADSERVICES permissions into the shipped manifest. The owner has now
    // decided to declare the advertising ID in Play Console (App content ->
    // Advertising ID -> Yes) instead of avoiding it, so the app has to carry a
    // component that genuinely uses the identifier; this is that component.
    //
    // Google's own Android documentation states that Analytics for Firebase
    // collects the Advertising ID by default - it documents how to switch that
    // off (google_analytics_adid_collection_enabled=false), which is only
    // meaningful because collection is on unless disabled:
    // https://firebase.google.com/docs/analytics/android/configure-data-collection
    //
    // ## What keeps this safe, and in step with the Console answer
    //   * collection is OFF until the listener turns analytics on, via the
    //     documented `firebase_analytics_collection_enabled=false` manifest
    //     meta-data plus `FirebaseAnalytics.setAnalyticsCollectionEnabled` on
    //     consent (lib/services/analytics/firebase_analytics_service.dart);
    //   * the identifier is never used for personalized advertising:
    //     `google_analytics_default_allow_ad_personalization_signals=false`;
    //   * the permission is declared explicitly in the manifest, so it cannot
    //     disappear while the Console says Yes (Play blocks releases whose
    //     declaration says Yes but whose artifact lacks it);
    //   * test/play_advertising_id_test.dart + the release workflow's permission
    //     audit fail if any of the three drift.
    // docs/PLAY_DATA_SAFETY.md holds the Console answers and the evidence.
    implementation 'com.google.firebase:firebase-analytics'
}